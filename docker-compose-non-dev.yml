# -----------------------------------------------------------------------
# Nondev deployment: locally hosted over plain HTTP. See DEPLOYMENT.md.
#
#   docker compose -f docker-compose-non-dev.yml up -d --build
#
# Serves a pre-built frontend bundle through gunicorn instead of the webpack dev
# server, so it is not development-shaped — but it is not hardened either: plain
# HTTP, root containers, and the development defaults in docker/.env. Use it on a
# trusted network only. For anything internet-facing use docker-compose-secure.yml.
# -----------------------------------------------------------------------

# Same project name as docker-compose.yml on purpose: the two modes share volumes,
# so a nondev stack picks up whatever a dev stack created. Pinned rather than
# derived from the directory name, which is Compose's fallback.
# docker-compose-secure.yml uses lauretta-superset-secure and stays separate.
name: lauretta-superset

x-superset-volumes:
  &superset-volumes # /app/pythonpath_docker will be appended to the PYTHONPATH in the final container
  - ./docker:/app/docker
  - superset_home:/app/superset_home
  - ./lauretta:/app/lauretta
  - ./lauretta/branding:/app/superset/static/assets/branding

x-common-build: &common-build
  context: .
  target: dev
  args:
    # Must be false, or the superset-node stage skips `npm ci` + `npm run build`
    # and the image ships an empty /app/superset/static/assets. This mode serves
    # the bundle from the image (unlike docker-compose.yml, which proxies /static
    # to a webpack dev server), so without it every asset 404s and the UI is
    # unusable. It happens to be the Dockerfile default — pinned here so a change
    # to that default cannot silently break this mode.
    DEV_MODE: "false"
  cache_from:
    - apache/superset-cache:3.10-slim-bookworm

# Image tags are pinned explicitly across all three compose files, as
# lauretta-superset-<mode>. Left implicit, Compose derives the tag from the project
# name plus the service name — and this file and docker-compose.yml share both, so
# they collided on one tag and silently overwrote each other despite building with
# opposite DEV_MODE values. See DEPLOYMENT.md ("Image tags").
x-common-image: &common-image lauretta-superset-nondev:latest

services:
  redis:
    image: redis:7
    container_name: superset_cache
    restart: unless-stopped
    volumes:
      - redis:/data

  db:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    image: postgres:15
    container_name: superset_db
    restart: unless-stopped
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  superset:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    build:
      <<: *common-build
    image: *common-image
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    user: "root"
    restart: unless-stopped
    ports:
      - 8088:8088
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes: *superset-volumes
    environment:
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"

  superset-init:
    container_name: superset_init
    build:
      <<: *common-build
    image: *common-image
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true
    environment:
      SUPERSET_LOAD_EXAMPLES: "${SUPERSET_LOAD_EXAMPLES:-yes}"
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"

  superset-worker:
    build:
      <<: *common-build
    image: *common-image
    container_name: superset_worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME",
        ]
    environment:
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"

  superset-worker-beat:
    build:
      <<: *common-build
    image: *common-image
    container_name: superset_worker_beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes: *superset-volumes
    healthcheck:
      disable: true
    environment:
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"

volumes:
  superset_home:
    external: false
  db_home:
    external: false
  redis:
    external: false
