# -----------------------------------------------------------------------------
# Reference reverse-proxy config for the hardened deployment.
#
# This file is NOT read by docker-compose-secure.yml. nginx runs on the host; copy
# this into place and edit the two marked values:
#
#   sudo cp docker/nginx/superset-secure.conf \
#           /etc/nginx/sites-available/superset
#   sudo ln -s /etc/nginx/sites-available/superset /etc/nginx/sites-enabled/
#   # edit server_name and the ssl_certificate paths below
#   sudo nginx -t && sudo systemctl reload nginx
#
# Do not confuse this with docker/nginx/nginx.conf, which is a plain-HTTP
# development helper that proxies /static to a webpack dev server.
#
# Certificates: `sudo certbot --nginx -d superset.example.com` will fill in the
# ssl_certificate paths for you.
# -----------------------------------------------------------------------------

# Suppress the nginx version in Server: headers and error pages. Version disclosure
# is a standard scanner finding. Belongs in the http{} block — move it to
# /etc/nginx/nginx.conf if this file is included from within http{} (which it is
# under the sites-enabled convention, in which case this line will be rejected here).
# server_tokens off;

# Rate-limit the login endpoint at the edge, in addition to Superset's own
# AUTH_RATE_LIMIT. Cheap protection against credential stuffing.
limit_req_zone $binary_remote_addr zone=superset_login:10m rate=10r/m;

# --- Redirect all plaintext traffic -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name superset.example.com;   # <-- EDIT

    # Leave ACME reachable over HTTP so certbot renewals keep working.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- TLS ----------------------------------------------------------------------
server {
    # HTTP/2 has two spellings and they are not interchangeable:
    #
    #   * `listen ... http2` (below) works on every version. nginx 1.25.1 deprecated
    #     it and warns on reload, but still honours it.
    #   * `http2 on;` is the replacement, and is a hard error on anything older —
    #     "unknown directive" — so nginx refuses to start rather than degrading.
    #
    # The compatible form is the default here because the failure mode of the other
    # one is a proxy that will not boot. Ubuntu 20.04 still ships nginx 1.18, and
    # 22.04 ships 1.22; neither understands `http2 on;`.
    #
    # On nginx >= 1.25.1 (`nginx -v`), comment out the two lines below and uncomment
    # the block after them to drop the deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;
    server_name superset.example.com;   # <-- EDIT

    ssl_certificate     /etc/letsencrypt/live/superset.example.com/fullchain.pem;  # <-- EDIT
    ssl_certificate_key /etc/letsencrypt/live/superset.example.com/privkey.pem;    # <-- EDIT

    # TLS 1.0/1.1 and their cipher suites are automatic failures on any TLS scan.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Off so TLS 1.3 clients pick their own preference order; the 1.2 list above is
    # already AEAD-only with forward secrecy.
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:secp384r1;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Session tickets without rotation undermine forward secrecy.
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/superset.example.com/chain.pem;  # <-- EDIT
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Response headers -----------------------------------------------------
    # Talisman already sets HSTS, X-Frame-Options, X-Content-Type-Options and
    # Referrer-Policy once ENABLE_PROXY_FIX is on, and Superset sets a minimal
    # Permissions-Policy ("browsing-topics=()"). Adding ours on top of those emits
    # each header twice — scanners flag the duplication, and for Permissions-Policy
    # the two values genuinely disagree.
    #
    # So: strip the upstream copy, then set our own. nginx ends up the single
    # authority for these five, which also means they survive a misconfigured app
    # and appear on responses nginx generates itself (error pages, redirects).
    # `always` makes them apply to 4xx and 5xx too.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # browsing-topics=() is carried over from the value Superset sends, which the
    # proxy_hide_header above removes.
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Deliberately no Content-Security-Policy here: Superset's CSP is nonce-based
    # (content_security_policy_nonce_in), so it must be generated per-response by
    # the app. A static CSP set at this layer would break the frontend.

    # Uploads: floor-map images. Keep at or below the app's MAX_CONTENT_LENGTH
    # (16 MB in superset_config_secure.py).
    client_max_body_size 16m;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # SQL Lab queries and chart renders can legitimately run for minutes.
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;
    # text/html is always compressed. Note gzip is intentionally NOT enabled for
    # proxied requests carrying a Via header (gzip_proxied is left at its default)
    # and TLS compression is off by default in modern nginx — both CRIME-adjacent.

    access_log /var/log/nginx/superset.access.log;
    error_log  /var/log/nginx/superset.error.log warn;

    # Block requests that reach us with an unexpected Host header.
    if ($host != $server_name) {
        return 444;
    }

    location = /login/ {
        limit_req zone=superset_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_http_version 1.1;
        port_in_redirect off;
        proxy_redirect off;
    }

    location / {
        # The secure stack publishes 8088 on loopback only.
        proxy_pass http://127.0.0.1:8088;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $proxy_add_x_forwarded_for preserves any existing chain; a bare
        # $remote_addr (as in the dev nginx.conf) discards it.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Superset builds absolute redirect URLs itself; let it.
        port_in_redirect off;
        proxy_redirect off;

        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_buffer_size 128k;
    }
}
