# -----------------------------------------------------------------------------
# HA mode TLS terminator: the whole nginx.conf of the `nginx` service in
# docker-compose-ha.yml (mounted at /etc/nginx/nginx.conf; a conf.d file cannot
# load the njs module, which /ready needs). See lauretta/docs/11-ha-mode.md.
#
# Derived from superset-secure.conf (the host nginx of secure mode). Differences:
#   * runs in a container on the compose network and proxies to superset:8088
#   * no port-80 listener, no OCSP stapling (certificate may be from a private CA)
#   * no server_name filter: each node is reached by its own address and the DNS name
#   * Host is forwarded with its port and X-Forwarded-Port is blanked: the container
#     listens on 8443 whatever port is published, and a client-sent value would
#     otherwise reach ProxyFix (x_port=1 in the secure config)
#   * GET /ready: readiness for DNS health checks, from a status file (see below)
#   * a second, plain-HTTP server for host-side checks, published on 127.0.0.1 only
# -----------------------------------------------------------------------------

load_module modules/ngx_http_js_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # /ready: 200 only if the readiness status file says ready and is fresh. The file is
    # written on the host every few seconds by a per-node producer (the cluster manager
    # in raib-ha) into the directory mounted at /run/superset-ha; nginx never asks the
    # databases, so DNS health checks cost nothing. See superset-ha-ready.js.
    js_path /etc/nginx/njs/;
    js_import ready from superset-ha-ready.js;

    limit_req_zone $binary_remote_addr zone=superset_login:10m rate=10r/m;

    # Liveness for the compose healthcheck only: container loopback, never published.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /nginx-health { return 200 "ok\n"; }
        location / { return 404; }
    }

    # Internal server for checks run on the host: docker-compose-ha.yml publishes it on
    # 127.0.0.1 only. It is the only way to reach the write probe, and it tags those
    # requests with the header the probe requires.
    server {
        listen 8082;
        access_log off;

        location = /health {
            proxy_pass http://superset:8088;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 10s;
        }
        location = /internal/ha/write-probe {
            proxy_pass http://superset:8088;
            proxy_set_header X-Forwarded-Proto  https;
            proxy_set_header X-Superset-Ha-Probe internal;
            proxy_read_timeout 15s;
        }
        location = /ready { js_content ready.serve; }
        location / { return 404; }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_ecdh_curve X25519:secp384r1;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # nginx is the single source of these headers (see superset-secure.conf).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        client_max_body_size 16m;
        client_body_timeout 60s;
        client_header_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        gzip on;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_vary on;
        gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

        # Readiness for the DNS health checks: no login, no database.
        location = /ready {
            access_log off;
            js_content ready.serve;
        }

        # Never public: the write probe lives under /internal/ (internal server above).
        location ^~ /internal/ { return 404; }

        # No floor-map uploads in HA mode: the endpoint writes lauretta/images/ on this node
        # only, so the other node would show a broken image. Floor maps come from the repo
        # (lauretta/images/, shipped to every node). See lauretta/docs/11-ha-mode.md.
        location ^~ /api/v1/lauretta/images/upload {
            default_type application/json;
            return 403 '{"message": "Floor-map uploads are disabled in HA mode; add the image to lauretta/images/ in the repository."}\n';
        }

        # proxy_set_header is inherited only by locations that set none, so both proxied
        # locations repeat the full list. X-Superset-Ha-Probe "" drops any client copy.
        location = /login/ {
            limit_req zone=superset_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://superset:8088;
            proxy_set_header Host                $http_host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   https;
            proxy_set_header X-Forwarded-Host    $http_host;
            proxy_set_header X-Forwarded-Port    "";
            proxy_set_header X-Superset-Ha-Probe "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_redirect off;
        }

        location / {
            proxy_pass http://superset:8088;
            proxy_set_header Host                $http_host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   https;
            proxy_set_header X-Forwarded-Host    $http_host;
            proxy_set_header X-Forwarded-Port    "";
            proxy_set_header X-Superset-Ha-Probe "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_redirect off;
            proxy_buffering on;
            proxy_buffers 16 64k;
            proxy_buffer_size 128k;
        }
    }
}
