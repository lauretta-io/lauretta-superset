# supmeta's pgAudit settings (image path /etc/postgresql/pgaudit.conf, included at the end of the
# database repo's ha.conf). First the settings of the other raib-ha DBs (the database repo's
# ha/pgaudit.conf: preload, DDL and role changes for every role, no bind parameters), then
# supmeta's own, which win.
include 'pgaudit.base.conf'

# Who reads the audit trail (raib-ha D104; client checklist 18.6.2.8). Object auditing: pgAudit
# logs a statement on lauretta_audit_log (AUDIT: OBJECT,...,READ) when this role holds a
# privilege the statement needs on it. raib-ha's Superset provisioning creates the role
# (NOLOGIN) and grants it SELECT on the table, so every read is logged: SELECT of any column or
# of the whole row, views and functions over it, COPY, pg_dump. Superset's own writes are not:
# it inserts without RETURNING (lauretta_audit.audit_table, implicit_returning=False). Its
# repeated-failed-login check reads the table after each failed login: those reads are logged.
# Before the provisioning (no role) nothing is object-audited; a superuser can turn it off.
pgaudit.role = 'lauretta_auditor'
